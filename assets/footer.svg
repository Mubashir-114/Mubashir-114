<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92" role="img" aria-labelledby="title desc">
  <title id="title">End of Mubashir's profile</title>
  <desc id="desc">A terminal prompt stating that thoughtful collaborations are welcome.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#5eead4"/>
      <stop offset="0.7" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="92" rx="8" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="90" rx="7" fill="none" stroke="#30363d"/>
  <rect x="64" y="20" width="872" height="2" rx="1" fill="url(#line)"/>
  <text x="500" y="58" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <tspan fill="#5eead4">mubashir@github</tspan><tspan fill="#6e7681">:~$</tspan><tspan fill="#c9d1d9"> open --to thoughtful-collaboration</tspan>
  </text>
  <rect x="746" y="44" width="8" height="17" rx="1" fill="#a78bfa">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <style>@media (prefers-reduced-motion: reduce) { animate { display: none; } }</style>
</svg>
