<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Mubashir - Full-Stack Developer</title>
  <desc id="desc">Mubashir builds production-oriented web, mobile, and AI-assisted applications with Python, Django, React, and Flutter.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop class="panelStart" offset="0"/>
      <stop class="panelMid" offset="0.56"/>
      <stop class="panelEnd" offset="1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path class="gridLine" d="M28 0H0V28" fill="none"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .panelStart { stop-color: #0d1117; }
    .panelMid { stop-color: #111827; }
    .panelEnd { stop-color: #10111c; }
    .frame { stroke: #30363d; }
    .gridLine { stroke: #94a3b8; stroke-opacity: 0.07; }
    .titleText { fill: #f0f6fc; }
    .bodyText { fill: #c9d1d9; }
    .mutedText { fill: #8b949e; }
    .route { stroke: #334155; }
    .node { fill: #101923; }
    .nodeLabel { fill: #e6edf3; }
    @media (prefers-color-scheme: light) {
      .panelStart { stop-color: #f6f8fa; }
      .panelMid { stop-color: #ffffff; }
      .panelEnd { stop-color: #eef2f7; }
      .frame { stroke: #d0d7de; }
      .gridLine { stroke: #57606a; stroke-opacity: 0.09; }
      .titleText { fill: #1f2328; }
      .bodyText { fill: #24292f; }
      .mutedText { fill: #57606a; }
      .route { stroke: #afb8c1; }
      .node { fill: #ffffff; }
      .nodeLabel { fill: #24292f; }
    }
    @media (prefers-reduced-motion: reduce) { animate { display: none; } }
  </style>

  <rect x="1" y="1" width="998" height="338" rx="8" fill="url(#panel)"/>
  <rect class="frame" x="1" y="1" width="998" height="338" rx="8" fill="none" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="338" rx="8" fill="url(#grid)"/>
  <path class="frame" d="M1 50H999"/>
  <circle cx="24" cy="25" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="25" r="5" fill="#febc2e"/>
  <circle cx="64" cy="25" r="5" fill="#28c840"/>
  <text class="mutedText" x="500" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">Mubashir-114 / profile</text>
  <circle cx="915" cy="25" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text class="mutedText" x="928" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">BUILDING</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="54" y="92" fill="#0ea5a0" font-size="14" font-weight="700">FULL-STACK DEVELOPER</text>
    <rect x="54" y="108" width="545" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="titleText" x="50" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="74" font-weight="800" letter-spacing="0">MUBASHIR</text>
    <text class="bodyText" x="54" y="236" font-size="18">Building production-oriented web, mobile</text>
    <text class="bodyText" x="54" y="267" font-size="18">and AI-assisted applications.</text>
    <text class="mutedText" x="54" y="307" font-size="13">Python / Django / React / Flutter</text>
    <rect x="333" y="292" width="9" height="18" rx="1" fill="#5eead4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(665 87)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path class="route" d="M58 44H116M174 44H226M145 68V88" fill="none" stroke-width="2" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <rect class="node" x="0" y="20" width="58" height="48" rx="6" stroke="#5eead4"/>
    <rect class="node" x="116" y="20" width="58" height="48" rx="6" stroke="#60a5fa"/>
    <rect class="node" x="226" y="20" width="58" height="48" rx="6" stroke="#a78bfa"/>
    <rect class="node" x="116" y="88" width="58" height="48" rx="6" stroke="#34d399"/>
    <text class="nodeLabel" x="29" y="49" font-size="12" text-anchor="middle">UI</text>
    <text class="nodeLabel" x="145" y="49" font-size="12" text-anchor="middle">API</text>
    <text class="nodeLabel" x="255" y="49" font-size="12" text-anchor="middle">DATA</text>
    <text class="nodeLabel" x="145" y="117" font-size="12" text-anchor="middle">MOBILE</text>
    <circle cx="75" cy="44" r="4" fill="#5eead4" filter="url(#glow)">
      <animate attributeName="cx" values="64;110;64" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="194" cy="44" r="4" fill="#a78bfa" filter="url(#glow)">
      <animate attributeName="cx" values="180;220;180" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="77" r="4" fill="#60a5fa" filter="url(#glow)">
      <animate attributeName="cy" values="73;83;73" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text class="mutedText" x="142" y="176" font-size="12" text-anchor="middle">DESIGN  +  SYSTEMS  +  DELIVERY</text>
  </g>
</svg>
