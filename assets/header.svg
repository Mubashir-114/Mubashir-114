<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Mubashir - full-stack developer</title>
  <desc id="desc">A dark terminal-inspired banner describing a developer who builds intelligent web platforms and cross-platform applications.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#10111c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="338" rx="8" fill="url(#panel)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="338" rx="8" fill="url(#grid)"/>
  <path d="M1 50H999" stroke="#30363d"/>
  <circle cx="24" cy="25" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="25" r="5" fill="#febc2e"/>
  <circle cx="64" cy="25" r="5" fill="#28c840"/>
  <text x="500" y="31" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">Mubashir-114 / profile</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="54" y="92" fill="#5eead4" font-size="14" font-weight="700">FULL-STACK DEVELOPER</text>
    <rect x="54" y="108" width="545" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="50" y="196" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="74" font-weight="800" letter-spacing="0">MUBASHIR</text>
    <text x="54" y="236" fill="#c9d1d9" font-size="18">I build intelligent web platforms</text>
    <text x="54" y="267" fill="#c9d1d9" font-size="18">and cross-platform applications.</text>
    <text x="54" y="307" fill="#8b949e" font-size="13">React / Django / Flutter / product-minded engineering</text>
    <rect x="589" y="292" width="9" height="18" rx="1" fill="#5eead4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(665 87)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M52 44H116M174 44H226M145 68V88" fill="none" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="20" width="58" height="48" rx="6" fill="#101923" stroke="#5eead4"/>
    <rect x="116" y="20" width="58" height="48" rx="6" fill="#111827" stroke="#60a5fa"/>
    <rect x="226" y="20" width="58" height="48" rx="6" fill="#151326" stroke="#a78bfa"/>
    <rect x="116" y="88" width="58" height="48" rx="6" fill="#101923" stroke="#34d399"/>
    <text x="29" y="49" fill="#d1fae5" font-size="12" text-anchor="middle">UI</text>
    <text x="145" y="49" fill="#dbeafe" font-size="12" text-anchor="middle">API</text>
    <text x="255" y="49" fill="#ede9fe" font-size="12" text-anchor="middle">DATA</text>
    <text x="145" y="117" fill="#d1fae5" font-size="12" text-anchor="middle">MOBILE</text>
    <circle cx="75" cy="44" r="4" fill="#5eead4" filter="url(#glow)">
      <animate attributeName="cx" values="62;110;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="194" cy="44" r="4" fill="#a78bfa" filter="url(#glow)">
      <animate attributeName="cx" values="180;220;180" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="77" r="4" fill="#60a5fa" filter="url(#glow)">
      <animate attributeName="cy" values="72;84;72" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="142" y="176" fill="#8b949e" font-size="12" text-anchor="middle">DESIGN  +  SYSTEMS  +  DELIVERY</text>
  </g>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate { display: none; }
    }
  </style>
</svg>
