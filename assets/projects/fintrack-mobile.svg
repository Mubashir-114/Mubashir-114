<svg xmlns="http://www.w3.org/2000/svg" width="360" height="278" viewBox="0 0 360 278" role="img" aria-labelledby="title desc">
  <title id="title">Fintrack project card</title>
  <desc id="desc">Cross-platform finance application for transactions, budgets, reports, and offline-aware mobile workflows. View the repository on GitHub.</desc>
  <defs>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4AB"/>
      <stop offset="0.72" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="topEdge"><rect width="360" height="5" rx="2"/></clipPath>
  </defs>
  <style>
    .surface { fill: #0d1117; }
    .border { fill: none; stroke: #30363d; }
    .titleText { fill: #f0f6fc; font: 700 22px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .body { fill: #c9d1d9; font: 13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .muted { fill: #8b949e; font: 8.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .stack { fill: #c9d1d9; font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .accentText { fill: #00B4AB; }
    .chip { fill: #111827; stroke: #30363d; }
    .chipText { fill: #aeb8c4; font: 700 7.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .repo { fill: #60a5fa; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) {
      .surface { fill: #ffffff; } .border { stroke: #d0d7de; } .titleText { fill: #1f2328; }
      .body, .stack { fill: #24292f; } .muted { fill: #59636e; } .accentText { fill: #007b75; }
      .chip { fill: #f6f8fa; stroke: #d0d7de; } .chipText { fill: #424a53; } .repo { fill: #0550ae; }
    }
    @media (prefers-reduced-motion: reduce) { animate { display: none; } }
  </style>
  <rect class="surface" x="1" y="1" width="358" height="276" rx="8"/>
  <rect class="border" x="1" y="1" width="358" height="276" rx="8"/>
  <rect x="1" y="1" width="358" height="4" rx="2" fill="url(#accentLine)"/>
  <rect x="-80" y="1" width="70" height="4" fill="#60a5fa" opacity="0.75" filter="url(#softGlow)" clip-path="url(#topEdge)">
    <animate attributeName="x" values="-80;370" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="5" height="276" rx="2" fill="#00B4AB"/>
  <text class="muted accentText" x="20" y="29" font-weight="700">03 / PROJECT</text>
  <circle cx="216" cy="25" r="4" fill="#00B4AB"><animate attributeName="opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <text class="muted" x="340" y="29" text-anchor="end">GITHUB PRIMARY: Dart</text>
  <text class="titleText" x="20" y="65">FINTRACK</text>
  <text class="body" x="20" y="99">Cross-platform finance application for transactions, budgets,</text><text class="body" x="20" y="121">reports, and offline-aware mobile workflows.</text>
  <text class="muted" x="20" y="148">STACK</text>
  <text class="stack" x="20" y="168">Flutter / Dart / Provider</text><text class="stack" x="20" y="186">Repository Pattern / REST APIs</text>
  <rect class="chip" x="14" y="207" width="86" height="27" rx="5"/><text class="chipText" x="57.1" y="225" text-anchor="middle">SECURE TOKENS</text><rect class="chip" x="106" y="207" width="107" height="27" rx="5"/><text class="chipText" x="159.6" y="225" text-anchor="middle">FINANCIAL REPORTS</text><rect class="chip" x="219" y="207" width="86" height="27" rx="5"/><text class="chipText" x="262.1" y="225" text-anchor="middle">OFFLINE AWARE</text>
  <path d="M20 248H340" stroke="#30363d" stroke-opacity="0.65"/>
  <text class="repo" x="20" y="267">VIEW REPOSITORY  -&gt;</text>
</svg>
