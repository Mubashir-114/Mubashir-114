<svg xmlns="http://www.w3.org/2000/svg" width="360" height="278" viewBox="0 0 360 278" role="img" aria-labelledby="title desc">
  <title id="title">Nexo project card</title>
  <desc id="desc">React product interface unifying conversations, projects, documents, knowledge, search, and workspace analytics. View the repository on GitHub.</desc>
  <defs>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.72" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="topEdge"><rect width="360" height="5" rx="2"/></clipPath>
  </defs>
  <style>
    .surface { fill: #0d1117; }
    .border { fill: none; stroke: #30363d; }
    .titleText { fill: #f0f6fc; font: 700 22px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .body { fill: #c9d1d9; font: 12.5px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .muted { fill: #8b949e; font: 8.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .stack { fill: #c9d1d9; font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .accentText { fill: #3b82f6; }
    .chip { fill: #111827; stroke: #30363d; }
    .chipText { fill: #aeb8c4; font: 700 7.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .repo { fill: #a855f7; font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) {
      .surface { fill: #ffffff; } .border { stroke: #d0d7de; } .titleText { fill: #1f2328; }
      .body, .stack { fill: #24292f; } .muted { fill: #59636e; } .accentText { fill: #1d4ed8; }
      .chip { fill: #f6f8fa; stroke: #d0d7de; } .chipText { fill: #424a53; } .repo { fill: #0550ae; }
    }
    @media (prefers-reduced-motion: reduce) { animate { display: none; } }
  </style>
  <rect class="surface" x="1" y="1" width="358" height="276" rx="8"/>
  <rect class="border" x="1" y="1" width="358" height="276" rx="8"/>
  <rect x="1" y="1" width="358" height="4" rx="2" fill="url(#accentLine)"/>
  <rect x="-80" y="1" width="70" height="4" fill="#a855f7" opacity="0.75" filter="url(#softGlow)" clip-path="url(#topEdge)">
    <animate attributeName="x" values="-80;370" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="5" height="276" rx="2" fill="#3b82f6"/>
  <text class="muted accentText" x="20" y="29" font-weight="700">04 / PROJECT</text>
  <circle cx="216" cy="25" r="4" fill="#3b82f6"><animate attributeName="opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <text class="muted" x="340" y="29" text-anchor="end">GITHUB PRIMARY: JavaScript</text>
  <image href="data:image/svg+xml;base64," x="20" y="45" width="22" height="22" preserveAspectRatio="xMidYMid meet"/>
  <text class="titleText" x="52" y="65">NEXO</text>
  <text class="body" x="20" y="96">React product interface unifying conversations,</text><text class="body" x="20" y="114">projects, documents, knowledge, search, and</text><text class="body" x="20" y="132">workspace analytics.</text>
  <text class="muted" x="20" y="148">STACK</text>
  <text class="stack" x="20" y="168">React / Vite / Zustand</text><text class="stack" x="20" y="186">Framer Motion / CSS</text>
  <rect class="chip" x="14" y="207" width="84" height="27" rx="5"/><text class="chipText" x="56.0" y="225" text-anchor="middle">WORKSPACE UI</text><rect class="chip" x="104" y="207" width="91" height="27" rx="5"/><text class="chipText" x="149.7" y="225" text-anchor="middle">COMMAND SEARCH</text><rect class="chip" x="201" y="207" width="112" height="27" rx="5"/><text class="chipText" x="257.3" y="225" text-anchor="middle">STATE ARCHITECTURE</text>
  <path d="M20 248H340" stroke="#30363d" stroke-opacity="0.65"/>
  <text class="repo" x="20" y="267">VIEW REPOSITORY  -&gt;</text>
</svg>
