  <rect x="28" y="44" width="30" height="30" rx="5" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.55"/><text class="index" x="43" y="64" text-anchor="middle" fill="#60a5fa">01</text><text class="label" x="76" y="64">FRONTEND</text><text class="body copy" x="168" y="57">Building product-oriented React interfaces with deliberate systems</text><text class="body copy" x="168" y="74">and interaction design.</text><path class="rule" d="M28 87H732"/><rect x="28" y="100" width="30" height="30" rx="5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/><text class="index" x="43" y="120" text-anchor="middle" fill="#34d399">02</text><text class="label" x="76" y="120">BACKEND</text><text class="body copy" x="168" y="113">Developing Django platforms with authentication, role-based</text><text class="body copy" x="168" y="130">workflows, APIs, and AI-assisted functionality.</text><path class="rule" d="M28 143H732"/><rect x="28" y="156" width="30" height="30" rx="5" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.55"/><text class="index" x="43" y="176" text-anchor="middle" fill="#f59e0b">03</text><text class="label" x="76" y="176">MOBILE</text><text class="body copy" x="168" y="169">Building Flutter applications around structured architecture,</text><text class="body copy" x="168" y="186">API integration, and practical user workflows.</text>
