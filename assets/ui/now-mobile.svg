  <rect x="16" y="43" width="28" height="28" rx="5" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.55"/><text class="index" x="30" y="62" text-anchor="middle" fill="#60a5fa">01</text><text class="label" x="54" y="62">FRONTEND</text><text class="body copy" x="54" y="78">Building product-oriented React interfaces</text><text class="body copy" x="54" y="91">with deliberate systems and interaction</text><text class="body copy" x="54" y="104">design.</text><path class="rule" d="M16 107H344"/><rect x="16" y="115" width="28" height="28" rx="5" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/><text class="index" x="30" y="134" text-anchor="middle" fill="#34d399">02</text><text class="label" x="54" y="134">BACKEND</text><text class="body copy" x="54" y="150">Developing Django platforms with authentication,</text><text class="body copy" x="54" y="163">role-based workflows, APIs, and AI-assisted</text><text class="body copy" x="54" y="176">functionality.</text><path class="rule" d="M16 179H344"/><rect x="16" y="187" width="28" height="28" rx="5" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.55"/><text class="index" x="30" y="206" text-anchor="middle" fill="#f59e0b">03</text><text class="label" x="54" y="206">MOBILE</text><text class="body copy" x="54" y="222">Building Flutter applications around structured</text><text class="body copy" x="54" y="235">architecture, API integration, and practical</text><text class="body copy" x="54" y="248">user workflows.</text>
