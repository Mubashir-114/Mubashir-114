<svg xmlns="http://www.w3.org/2000/svg" width="360" height="266" viewBox="0 0 360 266" role="img" aria-labelledby="title desc">
  <title id="title">Current focus</title>
  <desc id="desc">Three active areas: frontend, backend, and mobile development.</desc>
  <style>
    
    .surface { fill: #0d1117; }
