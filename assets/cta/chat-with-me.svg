<svg xmlns="http://www.w3.org/2000/svg" width="372" height="82" viewBox="0 0 372 82" role="img" aria-labelledby="title desc">
  <title id="title">Chat with me</title>
  <desc id="desc">Open to thoughtful collaboration.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    .title { fill: #f0f6fc; font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .copy { fill: #8b949e; font: 12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .mono { fill: #a78bfa; font: 700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) {
      .title { fill: #1f2328; }
      .copy { fill: #59636e; }
    }
    @media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }
  </style>
  <rect x="1" y="1" width="370" height="80" rx="8" fill="url(#surface)"/>
  <rect x="1.5" y="1.5" width="369" height="79" rx="7.5" fill="none" stroke="#30363d"/>
  <rect x="1" y="1" width="370" height="3" rx="1.5" fill="url(#accent)"/>
  <rect x="-80" y="1" width="62" height="3" fill="#5eead4" opacity="0.7" filter="url(#glow)">
    <animate attributeName="x" values="-80;390" dur="6.2s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(22 20)">
    <rect x="0" y="0" width="42" height="42" rx="7" fill="#0d1117" stroke="#30363d"/>
    <path d="M12 14h18a5 5 0 0 1 5 5v5a5 5 0 0 1-5 5h-8l-7 6v-6h-3a5 5 0 0 1-5-5v-5a5 5 0 0 1 5-5z" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="17" cy="22" r="1.6" fill="#5eead4"/>
    <circle cx="23" cy="22" r="1.6" fill="#60a5fa"/>
    <circle cx="29" cy="22" r="1.6" fill="#c084fc"/>
  </g>
  <text class="mono" x="80" y="27">DIRECT CHANNEL</text>
  <text class="title" x="80" y="48">CHAT WITH ME</text>
  <text class="copy" x="80" y="66">Open to thoughtful collaboration</text>
  <g transform="translate(327 40)">
    <path d="M-10 0h24M6 -8l8 8-8 8" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
